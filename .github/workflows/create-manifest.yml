name: Create Release Manifest PR

# Triggered by the Release Manifest Builder site via a repository_dispatch event.
on:
  repository_dispatch:
    types: [create-manifest]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-manifest-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write manifest file
        env:
          # Passed through env vars to avoid shell-injection from untrusted payload.
          MANIFEST: ${{ toJSON(github.event.client_payload.manifest) }}
          RELEASE: ${{ github.event.client_payload.release }}
          DATE: ${{ github.event.client_payload.date }}
        run: |
          mkdir -p manifests
          # Build a filesystem-safe slug from release + date.
          SLUG=$(printf '%s-%s' "$RELEASE" "$DATE" | tr -c '[:alnum:]._-' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          [ -z "$SLUG" ] && SLUG="manifest-$(date +%s)"
          echo "$MANIFEST" > "manifests/manifest-${SLUG}.json"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          echo "Wrote manifests/manifest-${SLUG}.json"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          # Uses the default GITHUB_TOKEN. Requires: Settings → Actions → General
          # → Workflow permissions → "Allow GitHub Actions to create and approve
          # pull requests" (already enabled — this path worked once).
          branch: manifest/${{ env.SLUG }}
          base: ${{ github.event.repository.default_branch }}
          title: "Release Manifest: ${{ github.event.client_payload.release }} (${{ github.event.client_payload.date }})"
          commit-message: "chore: add release manifest ${{ env.SLUG }}"
          body: |
            ## Release Manifest

            Automatically generated by the **Release Manifest Builder**.

            - **Release:** `${{ github.event.client_payload.release }}`
            - **Date:** `${{ github.event.client_payload.date }}`
            - **File:** `manifests/manifest-${{ env.SLUG }}.json`

            Review the selected repositories per environment/tier and merge to record this release.
          labels: release-manifest
          delete-branch: true
